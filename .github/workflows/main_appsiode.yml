name: Build and deploy Node.js app to Azure Web App - appsiode

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Show version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Versión: v$VERSION — build ${{ github.run_number }} (${{ github.sha }})"
          echo "### SIODE frontend v$VERSION (build ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY

      - name: Install and Build
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          # GITHUB_SHA / GITHUB_RUN_NUMBER ya los expone el runner; next.config.mjs
          # los usa para armar el sello de compilación (cYYMMDD.run.sha).

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_NAME }}
          package: . # Sube TODO: .next, node_modules y package.json
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
